[project]
name = "brick-breaker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "gymnasium==1.4.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pygame-ce==2.5.8",
    "torch==2.15.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
